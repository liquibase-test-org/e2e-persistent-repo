name: Liquibase Deploy

on:
  push:
    branches: [main]
    paths:
      - 'liquibase/**'

  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: 'dev'

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment || 'dev' }}
    runs-on: ${{ vars.LIQUIBASE_RUNNER_LABEL || 'ubuntu-latest' }}
    environment: ${{ inputs.environment || 'dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for pre-installed Liquibase
        id: check-liquibase
        run: |
          if command -v liquibase &> /dev/null; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "✅ Liquibase is pre-installed: $(liquibase --version | head -1)"
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "⚠️ Liquibase not found, will install via setup-liquibase"
          fi

      - name: Setup Liquibase
        if: steps.check-liquibase.outputs.found != 'true'
        uses: liquibase/setup-liquibase@v2
        with:
          version: '5.0.0'
          edition: 'secure'

      - name: Set environment variables
        id: env
        run: |
          ENV_NAME="${{ inputs.environment || 'dev' }}"
          ENV_UPPER=$(echo "$ENV_NAME" | tr '[:lower:]' '[:upper:]')
          echo "env_name=$ENV_NAME" >> $GITHUB_OUTPUT
          echo "env_upper=$ENV_UPPER" >> $GITHUB_OUTPUT

      - name: Verify PostgreSQL is ready
        run: |
          echo "==> Checking Docker status..."
          docker --version

          echo "==> Checking if e2e-postgres container is running..."
          docker ps -a --filter name=e2e-postgres

          if ! docker ps --filter name=e2e-postgres --filter status=running | grep -q e2e-postgres; then
            echo "❌ PostgreSQL container is not running!"
            echo "Attempting to start it..."
            docker start e2e-postgres || {
              echo "Failed to start existing container. Creating new one..."
              docker run -d \
                --name e2e-postgres \
                --restart unless-stopped \
                -e POSTGRES_DB=e2e_testdb \
                -e POSTGRES_USER=e2e_user \
                -e POSTGRES_PASSWORD=e2e_password \
                -p 5432:5432 \
                postgres:16-alpine
              sleep 5
            }
          else
            echo "✅ PostgreSQL container is running"
          fi

          echo "==> Waiting for PostgreSQL to be ready..."
          for i in {1..30}; do
            if docker exec e2e-postgres pg_isready -U e2e_user > /dev/null 2>&1; then
              echo "✅ PostgreSQL is ready!"
              docker exec e2e-postgres psql -U e2e_user -d e2e_testdb -c "SELECT version();"
              exit 0
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

          echo "❌ PostgreSQL did not become ready in time"
          echo "Container logs:"
          docker logs e2e-postgres
          exit 1

      - name: Run Liquibase Update
        working-directory: liquibase
        env:
          LIQUIBASE_LICENSE_KEY: ${{ secrets.LIQUIBASE_LICENSE_KEY }}
        run: |
          liquibase update \
            --changelog-file=changelog.xml \
            --url="${{ secrets[format('LIQUIBASE_{0}_URL', steps.env.outputs.env_upper)] }}" \
            --username="${{ secrets[format('LIQUIBASE_{0}_USERNAME', steps.env.outputs.env_upper)] }}" \
            --password="${{ secrets[format('LIQUIBASE_{0}_PASSWORD', steps.env.outputs.env_upper)] }}"

      - name: Create deployment artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-${{ steps.env.outputs.env_name }}-${{ github.run_number }}
          path: |
            liquibase/changelog.xml
            liquibase/changelogs/
          retention-days: 90
